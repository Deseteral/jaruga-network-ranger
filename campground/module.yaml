product: jvm/app

settings:
  kotlin:
    version: 2.4.0
    serialization: json
    optIns: [ kotlinx.serialization.ExperimentalSerializationApi ]
  ktor:
    enabled: true
    version: 3.5.1

dependencies:
  - ../shared
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.client.cio
  - $ktor.client.contentNegotiation
  - io.github.oshai:kotlin-logging-jvm:8.0.4
  - ch.qos.logback:logback-classic:1.5.18

test-dependencies:
  - $ktor.server.testHost
