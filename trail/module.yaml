product: jvm/lib

settings:
  kotlin:
    version: 2.4.10
    serialization: json
    optIns: [ kotlinx.serialization.ExperimentalSerializationApi ]
  publishing:
    enabled: true
    group: xyz.deseteral.jaruga.ranger
    version: 1.0.0

repositories:
  - url: mavenLocal
    publish: true
  - id: github
    url: https://maven.pkg.github.com/deseteral/jaruga-network-ranger
    publish: true
    credentials:
      file: creds.properties
      usernameKey: username
      passwordKey: password

dependencies:
  - org.jetbrains.kotlin:kotlin-scripting-common:2.4.10
  - org.jetbrains.kotlin:kotlin-scripting-jvm:2.4.10
  - org.jetbrains.kotlin:kotlin-scripting-jvm-host:2.4.10
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.1
