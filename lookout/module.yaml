product: jvm/app

settings:
  kotlin:
    version: 2.4.10
    serialization: json
    optIns: [ kotlinx.serialization.ExperimentalSerializationApi ]
  ktor:
    enabled: true
    version: 3.5.2

dependencies:
  - ../trail
  - com.michael-bull.kotlin-result:kotlin-result:2.3.1
  - com.michael-bull.kotlin-result:kotlin-result-coroutines:2.3.1
  - org.jetbrains.kotlinx:kotlinx-datetime:0.8.0
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.1
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.client.cio
  - $ktor.client.contentNegotiation
  - ch.qos.logback:logback-classic:1.5.18
  - io.github.oshai:kotlin-logging-jvm:8.0.4

test-dependencies:
  - $ktor.server.testHost
